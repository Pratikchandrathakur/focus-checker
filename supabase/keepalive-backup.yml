# Keeps the free Supabase project from pausing and keeps a weekly backup.
# Needs repo secret SUPABASE_DB_URL (Project Settings -> Database -> connection string, session pooler).
name: Supabase keep-alive & backup
on:
  schedule:
    - cron: '17 3 * * *'   # daily keep-alive
    - cron: '41 3 * * 0'   # Sunday backup
  workflow_dispatch:
jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Install Postgres client
        run: sudo apt-get update -y && sudo apt-get install -y postgresql-client
      - name: Ping database
        run: psql "$SUPABASE_DB_URL" -c "select count(*) from public.history_items;"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      - name: Backup (Sundays or manual run)
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '41 3 * * 0'
        run: |
          pg_dump "$SUPABASE_DB_URL" --schema=public --no-owner --no-privileges -f backup.sql
          gzip backup.sql
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      - name: Upload backup (kept 30 days, private to repo)
        if: hashFiles('backup.sql.gz') != ''
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ github.run_id }}
          path: backup.sql.gz
          retention-days: 30
